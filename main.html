    <style>
        body {
            background-color: #050811;
            color: #f3f4f6;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* 3D Perspective Stage for Vivid Transitions */
        .stage-3d {
            perspective: 1200px;
            perspective-origin: 50% 50%;
        }

        .slide-3d {
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        .slide-cube-left {
            opacity: 0;
            transform: rotateY(-35deg) scale(0.9) translateX(-100px);
        }

        .slide-cube-right {
            opacity: 0;
            transform: rotateY(35deg) scale(0.9) translateX(100px);
        }

        .slide-active {
            opacity: 1;
            transform: rotateY(0deg) scale(1) translateX(0);
        }

        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(13, 20, 36, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.09);
        }

        .glass-card-hover {
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card-hover:hover {
            transform: translateY(-5px) scale(1.01);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 15px 35px -10px rgba(99, 102, 241, 0.3);
        }

        /* Animated Soundwave Equalizer */
        @keyframes eqPulse {
            0%, 100% { height: 12%; }
            50% { height: 98%; }
        }
        .animate-eq-bar {
            animation: eqPulse 1.1s ease-in-out infinite alternate;
        }

        /* Pulsing Glow Effect */
        @keyframes auraGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.08); }
        }
        .pulse-aura {
            animation: auraGlow 4s ease-in-out infinite;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #06b6d4;
            cursor: pointer;
            box-shadow: 0 0 20px #06b6d4;
            margin-top: -9px;
            transition: transform 0.15s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 7px;
            background: #1e293b;
            border-radius: 999px;
        }
    </style>

            const iconContainer = document.getElementById('dbStatusIcon');

            levelText.textContent = `${val} Decibels (dB)`;

            if (val < 55) {
                badge.className = "px-3 py-1 rounded-full text-xs font-mono font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                badge.textContent = `${val} dB • Peaceful & Safe`;
                soundType.textContent = "Quiet Countryside, Whisper, Suburban Library";
                desc.textContent = "Minimal sound pressure. Ideal environment for restful sleep and deep cognitive focus.";
                iconContainer.className = "w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shrink-0";
                iconContainer.innerHTML = `<i data-lucide="check-circle" class="w-6 h-6"></i>`;
            } else if (val < 85) {
                badge.className = "px-3 py-1 rounded-full text-xs font-mono font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-500/30";
                badge.textContent = `${val} dB • Moderate Ambient`;
                soundType.textContent = "Normal Conversation, Office HVAC, City Traffic";
                desc.textContent = "Standard urban noise level. Safe for continuous workplace exposure under 8 hours.";
                iconContainer.className = "w-12 h-12 rounded-2xl bg-cyan-500/20 border border-cyan-500/30 flex items-center justify-center text-cyan-400 shrink-0";
                iconContainer.innerHTML = `<i data-lucide="info" class="w-6 h-6"></i>`;
            } else if (val < 115) {
                badge.className = "px-3 py-1 rounded-full text-xs font-mono font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30";
                badge.textContent = `${val} dB • WHO Hazardous Limit`;
                soundType.textContent = "Lawn Mower, Diesel Truck, Jackhammer";
                desc.textContent = "WHO Danger Zone: Continuous exposure over 30 minutes risks micro-trauma to sensory hair cells.";
                iconContainer.className = "w-12 h-12 rounded-2xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 shrink-0";
                iconContainer.innerHTML = `<i data-lucide="alert-triangle" class="w-6 h-6"></i>`;
            } else {
                badge.className = "px-3 py-1 rounded-full text-xs font-mono font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30";
                badge.textContent = `${val} dB • Severe Pain & Acute Damage`;
                soundType.textContent = "Jet Engine Takeoff, Rock Concert Stack, Siren";
                desc.textContent = "Severe Danger: Immediate acoustic trauma and non-reversible structural inner ear damage.";
                iconContainer.className = "w-12 h-12 rounded-2xl bg-rose-500/20 border border-rose-500/30 flex items-center justify-center text-rose-400 shrink-0";
                iconContainer.innerHTML = `<i data-lucide="shield-alert" class="w-6 h-6"></i>`;
            }

            if (window.lucide) lucide.createIcons();
        }

        // FREQUENCY CANVAS SIMULATION
        function initFreqCanvas() {
            const canvas = document.getElementById('freqCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let frame = 0;

            function animateFreq() {
                if (!document.getElementById('freqCanvas')) return;
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.lineWidth = 2;
                ctx.strokeStyle = '#06b6d4';
                ctx.beginPath();

                const dbVal = document.getElementById('dbSlider') ? parseInt(document.getElementById('dbSlider').value) : 70;
                const amplitude = (dbVal / 140) * (canvas.height / 2.5);

                for (let x = 0; x < canvas.width; x += 4) {
                    const y = canvas.height / 2 + Math.sin(x * 0.05 + frame * 0.1) * amplitude * Math.cos(x * 0.01);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                frame++;
                requestAnimationFrame(animateFreq);
            }
            animateFreq();
        }

        // QUIZ ENGINE LOGIC
        function loadQuizQuestion(index) {
            const q = quizQuestions[index];
            if (!q) return;

            quizAnswered = false;
            document.getElementById('quizQuestionTitle').textContent = `Question ${index + 1} of 10`;
            document.getElementById('quizQuestionText').textContent = q.question;
            document.getElementById('quizScore').textContent = `Score: ${quizScore} / 10`;
            document.getElementById('quizStreak').textContent = `Streak: 🔥 ${quizStreak}`;
            document.getElementById('nextQuestionBtn').classList.add('hidden');
            document.getElementById('quizFeedbackBox').classList.add('hidden');

            const grid = document.getElementById('quizOptionsGrid');
            grid.innerHTML = q.options.map((opt, i) => `
                <button onclick="handleQuizAnswer(${i})" class="quiz-opt-btn w-full text-left p-3.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-800 text-xs text-slate-200 transition-all flex items-center justify-between">
                    <span>${opt}</span>
                    <i data-lucide="circle" class="w-4 h-4 text-slate-600"></i>
                </button>
            `).join('');

            if (window.lucide) lucide.createIcons();
        }

        function handleQuizAnswer(selectedIndex) {
            if (quizAnswered) return;
            quizAnswered = true;

            const q = quizQuestions[currentQuizIndex];
            const feedback = document.getElementById('quizFeedbackBox');
            const btns = document.querySelectorAll('.quiz-opt-btn');

            btns.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.correct) {
                    btn.classList.add('border-emerald-500', 'bg-emerald-500/10', 'text-emerald-300');
                } else if (idx === selectedIndex) {
                    btn.classList.add('border-rose-500', 'bg-rose-500/10', 'text-rose-300');
                }
            });

            feedback.classList.remove('hidden');

            if (selectedIndex === q.correct) {
                quizScore++;
                quizStreak++;
                feedback.className = "p-3.5 rounded-xl text-xs font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 flex items-start gap-2";
                feedback.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4 shrink-0 mt-0.5"></i> <div><b>Correct!</b> ${q.explanation}</div>`;
            } else {
                quizStreak = 0;
                feedback.className = "p-3.5 rounded-xl text-xs font-medium bg-rose-500/20 text-rose-300 border border-rose-500/30 flex items-start gap-2";
                feedback.innerHTML = `<i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i> <div><b>Incorrect.</b> ${q.explanation}</div>`;
            }

            document.getElementById('quizScore').textContent = `Score: ${quizScore} / 10`;
            document.getElementById('quizStreak').textContent = `Streak: 🔥 ${quizStreak}`;

            if (currentQuizIndex < quizQuestions.length - 1) {
                document.getElementById('nextQuestionBtn').classList.remove('hidden');
            } else {
                setTimeout(() => {
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                }, 300);
            }

            if (window.lucide) lucide.createIcons();
        }

        function nextQuestion() {
            if (currentQuizIndex < quizQuestions.length - 1) {
                currentQuizIndex++;
                loadQuizQuestion(currentQuizIndex);
            }
        }

        function resetQuiz() {
            currentQuizIndex = 0;
            quizScore = 0;
            quizStreak = 0;
            loadQuizQuestion(0);
        }

        // AMBIENT SOUNDWAVE CANVAS ANIMATION
        function initCanvasAnimation() {
            const canvas = document.getElementById('ambientCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            let step = 0;
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.lineWidth = 1.5;

                const colors = ['rgba(99, 102, 241, 0.3)', 'rgba(6, 182, 212, 0.25)', 'rgba(16, 185, 129, 0.2)'];

                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.strokeStyle = colors[i];
                    for (let x = 0; x < canvas.width; x += 15) {
                        const y = Math.sin((x * 0.002) + step + (i * 1.5)) * 45 + (canvas.height / 2);
                        if (x === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }

                step += 0.012;
                requestAnimationFrame(draw);
            }
            draw();
        }

        // EVENT LISTENERS & KEYBOARD BINDINGS
        function setupEventListeners() {
            document.getElementById('prevBtn').addEventListener('click', () => loadSlide(currentSlide - 1));
            document.getElementById('nextBtn').addEventListener('click', () => loadSlide(currentSlide + 1));

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'Space') {
                    e.preventDefault();
                    if (currentSlide < slides.length - 1) loadSlide(currentSlide + 1);
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    if (currentSlide > 0) loadSlide(currentSlide - 1);
                } else if (e.key.toLowerCase() === 'n') {
                    toggleSpeakerNotes();
                } else if (e.key.toLowerCase() === 'f') {
                    toggleFullscreen();
                }
            });

            document.getElementById('toggleNotesBtn').addEventListener('click', toggleSpeakerNotes);
            document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
        }

        function toggleSpeakerNotes() {
            document.getElementById('speakerNotesPanel').classList.toggle('hidden');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function setTheme(theme) {
            const root = document.documentElement;
            if (theme === 'purple') {
                root.style.setProperty('--theme-accent', '#a855f7');
            } else if (theme === 'amber') {
                root.style.setProperty('--theme-accent', '#f59e0b');
            } else {
                root.style.setProperty('--theme-accent', '#06b6d4');
            }
        }

        window.onload = function() {
            initApp();
        };
    </script>
